services:
  app:
    build:
      context: .
    ports:
      - "3000:3000"
    # Comment out env_file temporarily to ensure it's not overriding your test
    # env_file:
    #   - .env
    environment:
      DATABASE_URL: "postgresql://postgres:Stuttgart11%23@db:5432/kaaswinkel"
    command: sh -c "node scripts/migrate.js && node scripts/seed.js"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "Stuttgart11#"
      POSTGRES_DB: kaaswinkel
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

volumes:
  postgres_data:
