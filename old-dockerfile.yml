services:
  app:
    build:
      context: .
    # These must be at the same level as 'build', not inside it
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Compose will look for these in your shell or a file named '.env'
      DATABASE_URL: postgresql://postgres:Stuttgart11#@localhost:5432/kaaswinkel
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

volumes:
  postgres_data:
